<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="cyanPurpleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="neonGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity=".2"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="orbGlow" width="200%" height="200%" x="-50%" y="-50%"><feGaussianBlur result="blur" stdDeviation="30"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatCube{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(3deg)}}@keyframes rotateWireframe{0%{transform:rotate(0deg)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:950px 180px}.orb-2{animation:pulseOrb 10s ease-in-out infinite alternate-reverse;transform-origin:180px 300px}.cube-group,.ring-rotate{animation:floatCube 6s ease-in-out infinite;transform-origin:1020px 210px}.ring-rotate{animation:rotateWireframe 25s linear infinite}.stream-line{stroke-dasharray:8,8;animation:dashMove 4s linear infinite}.ti