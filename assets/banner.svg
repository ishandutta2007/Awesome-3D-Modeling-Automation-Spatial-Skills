<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Wireframe Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
    @keyframes rotateWireframe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 950px 180px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 180px 300px; }
    .cube-group { animation: floatCube 6s ease-in-out infinite; transform-origin: 1020px 210px; }
    .ring-rotate { animation: rotateWireframe 25s linear infinite; transform-origin: 1020px 210px; }
    .stream-line { stroke-dasharray: 8, 8; animation: dashMove 4s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .body-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-1" cx="980" cy="180" r="180" fill="#6366f1" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="200" cy="280" r="160" fill="#06b6d4" filter="url(#orbGlow)" />

  <!-- Isometric 3D Spatial Grid Perspective Planes -->
  <g opacity="0.35" transform="translate(700, 40)">
    <path d="M 0 320 L 320 220 L 500 270 L 180 370 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 80 295 L 400 195" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4, 4" />
    <path d="M 160 270 L 480 170" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4, 4" />
    <path d="M 240 245 L 360 210" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="4, 4" />
  </g>

  <!-- Connecting Animated Laser Stream -->
  <path class="stream-line" d="M 100 80 Q 550 20 1020 210" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Dynamic 3D Spatial Gizmo / Isometric Polyhedron (Right Side Foreground Graphic) -->
  <g class="ring-rotate">
    <ellipse cx="1020" cy="210" rx="140" ry="60" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="6, 6" opacity="0.5" />
    <ellipse cx="1020" cy="210" rx="60" ry="140" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="6, 6" opacity="0.4" />
  </g>

  <g class="cube-group">
    <!-- Isometric Center Bounding Box -->
    <!-- Top Face -->
    <polygon points="1020,130 1100,175 1020,220 940,175" fill="#1e293b" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="940,175 1020,220 1020,310 940,265" fill="#0f172a" fill-opacity="0.85" stroke="#818cf8" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="1020,220 1100,175 1100,265 1020,310" fill="#1e1b4b" fill-opacity="0.8" stroke="#c084fc" stroke-width="2" />
    
    <!-- 3D Coordinate Axis Gizmo inside Cube -->
    <line x1="1020" y1="220" x2="1020" y2="150" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <line x1="1020" y1="220" x2="1075" y2="190" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
    <line x1="1020" y1="220" x2="970" y2="250" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    <circle cx="1020" cy="220" r="4" fill="#ffffff" filter="url(#glow)" />
    
    <!-- Vertex Nodes -->
    <circle cx="1020" cy="130" r="3.5" fill="#38bdf8" />
    <circle cx="1100" cy="175" r="3.5" fill="#c084fc" />
    <circle cx="940" cy="175" r="3.5" fill="#818cf8" />
    <circle cx="1020" cy="310" r="3.5" fill="#38bdf8" />
    <circle cx="1100" cy="265" r="3.5" fill="#818cf8" />
    <circle cx="940" cy="265" r="3.5" fill="#c084fc" />
  </g>

  <!-- Foreground Content: Pill Badges -->
  <g transform="translate(80, 68)">
    <rect width="180" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981" />
    <text class="body-text" x="30" y="20" fill="#93c5fd" font-size="12" font-weight="600" letter-spacing="0.5">SPATIAL AI AGENTS</text>
  </g>

  <g transform="translate(272, 68)">
    <rect width="168" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
    <text class="body-text" x="18" y="20" fill="#c7d2fe" font-size="12" font-weight="600" letter-spacing="0.5">BLENDER &amp; CAD MCP</text>
  </g>

  <g transform="translate(452, 68)">
    <rect width="176" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
    <text class="body-text" x="18" y="20" fill="#e9d5ff" font-size="12" font-weight="600" letter-spacing="0.5">3D CODE AUTOMATION</text>
  </g>

  <!-- Main Headline Title (Foreground & Crisp) -->
  <g transform="translate(80, 158)">
    <text class="title-text" font-size="44" fill="url(#cyanPurpleGrad)" filter="url(#glow)">Awesome 3D Modeling Automation</text>
    <text class="title-text" y="52" font-size="38" fill="#ffffff">&amp; Spatial Skills Ecosystem 🚀</text>
  </g>

  <!-- Subtitle / Tagline -->
  <g transform="translate(80, 260)">
    <text class="body-text" font-size="18" fill="#94a3b8" font-weight="500">
      Curated directory of AI Agent 3D Skills, Model Context Protocol (MCP) Servers,
    </text>
    <text class="body-text" y="28" font-size="18" fill="#94a3b8" font-weight="500">
      Parametric CAD Scripting, B-Rep Kernels, and Cloud 3D Web Platforms.
    </text>
  </g>

  <!-- Bottom Metric & Tech Highlights Bar -->
  <g transform="translate(80, 345)">
    <rect width="780" height="42" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text class="body-text" x="20" y="26" fill="#38bdf8" font-size="13" font-weight="700">KERNEL ENGINES:</text>
    <text class="body-text" x="150" y="26" fill="#cbd5e1" font-size="13" font-weight="500">Three.js • Blender bpy • OpenCascade • CGAL • Parasolid • OpenSCAD</text>
  </g>
</svg>
